<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الأدمن | منصة الأطباء</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .form-msg {
            margin-top: 18px;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 700;
            text-align: center;
        }
        .form-msg.success {
            background: rgba(46, 160, 90, 0.15);
            border: 1px solid #2ea05a;
            color: #7ee2a8;
        }
        .form-msg.error {
            background: rgba(220, 70, 70, 0.15);
            border: 1px solid #dc4646;
            color: #ff9a9a;
        }
    </style>
</head>
<body>

<header>
    <h1><span class="logo-icon">🏥</span> منصة الأطباء</h1>
    <nav>
        <a href="index.html">الرئيسية</a>
    </nav>
</header>

<main>
    <section>
        <div class="section-heading">
            <div><span>لوحة التحكم</span><h2>🔐 دخول الأدمن</h2></div>
        </div>

        <form id="loginForm">
            <label for="username">اسم المستخدم</label>
            <input type="text" id="username" name="username" autocomplete="username" required>

            <label for="password">كلمة المرور</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <button type="submit" id="loginBtn">دخول</button>

            <p id="formMsg" class="form-msg" hidden></p>
        </form>
    </section>
</main>

<footer>
    <p>© 2026 منصة الأطباء</p>
</footer>

<script>
const form = document.getElementById("loginForm");
const msg = document.getElementById("formMsg");
const btn = document.getElementById("loginBtn");

function showMsg(text, type) {
    msg.hidden = false;
    msg.className = "form-msg " + type;
    msg.textContent = text;
}

form.addEventListener("submit", async function (e) {
    e.preventDefault();
    btn.disabled = true;

    try {
        const response = await fetch("admin-login.php", {
            method: "POST",
            body: new FormData(form)
        });
        const data = await response.json();

        if (data.ok) {
            window.location.href = "admin.php";
        } else {
            showMsg("❌ " + data.message, "error");
        }
    } catch (err) {
        showMsg("❌ تعذر الاتصال بالخادم. تأكد أن Apache شغال وأنك فاتح الصفحة من localhost.", "error");
    }

    btn.disabled = false;
});
</script>

</body>
</html>
