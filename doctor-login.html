<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الطبيب | منصة الأطباء</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .form-msg {
            margin-top: 18px;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 700;
            text-align: center;
        }
        .form-msg.error {
            background: rgba(220, 70, 70, 0.15);
            border: 1px solid #dc4646;
            color: #ff9a9a;
        }
        .login-links { text-align: center; margin-top: 16px; }
    </style>
</head>
<body>

<header>
    <h1><span class="logo-icon">🏥</span> منصة الأطباء</h1>
    <nav>
        <a href="index.html">الرئيسية</a>
        <a href="specialties.html">التخصصات</a>
        <a href="doctors.html">الأطباء</a>
        <a href="doctor-register.html">للأطباء</a>
    </nav>
</header>

<main>
    <section>
        <div class="section-heading">
            <div><span>للأطباء</span><h2>🩺 دخول الطبيب</h2></div>
        </div>

        <form id="loginForm">
            <label for="email">البريد الإلكتروني</label>
            <input type="email" id="email" name="email" autocomplete="username" required>

            <label for="password">كلمة المرور</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <button type="submit" id="loginBtn">دخول</button>

            <p id="formMsg" class="form-msg" hidden></p>

            <p class="login-links">ما عندك حساب؟ <a href="doctor-register.html">سجّل كطبيب</a></p>
        </form>
    </section>
</main>

<footer>
    <p>© 2026 منصة الأطباء</p>
</footer>

<script>
const form = document.getElementById("loginForm");
const msg = document.getElementById("formMsg");
const btn = document.getElementById("loginBtn");

form.addEventListener("submit", async function (e) {
    e.preventDefault();
    btn.disabled = true;

    try {
        const response = await fetch("doctor-login.php", {
            method: "POST",
            body: new FormData(form)
        });
        const data = await response.json();

        if (data.ok) {
            window.location.href = "doctor-dashboard.php";
        } else {
            msg.hidden = false;
            msg.className = "form-msg error";
            msg.textContent = "❌ " + data.message;
        }
    } catch (err) {
        msg.hidden = false;
        msg.className = "form-msg error";
        msg.textContent = "❌ تعذر الاتصال بالخادم. تأكد أن Apache شغال وأنك فاتح الصفحة من localhost.";
    }

    btn.disabled = false;
});
</script>

</body>
</html>
